<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Page Not Found | CIDH-BU</title>

    <meta
        name="robots"
        content="noindex"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #f5f8f6;
            color: #1f2933;
            padding: 30px;
        }

        .error-container {
            max-width: 600px;
        }

        .logo {
            width: 110px;
            margin-bottom: 25px;
        }

        .error-code {
            font-size: 90px;
            font-weight: 800;
            color: #0b5d3b;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 30px;
            color: #555;
        }

        .home-button {
            display: inline-block;
            padding: 14px 28px;
            background: #0b5d3b;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .home-button:hover {
            opacity: 0.9;
        }

    </style>

</head>

<body>

    <div class="error-container">

        <img
            src="images/logo.png"
            alt="CIDH-BU Logo"
            class="logo"
        >

        <div class="error-code">
            404
        </div>

        <h1>
            Page Not Found
        </h1>

        <p>
            Sorry, the page you are looking for could not
            be found. Please return to the CIDH-BU homepage.
        </p>

        <a
            href="index.html"
            class="home-button"
        >
            Return to Homepage
        </a>

    </div>

</body>

</html>
